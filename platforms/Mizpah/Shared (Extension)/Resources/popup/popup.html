<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mizpah</title>
  <link rel="stylesheet" href="../options/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 class="sr-only">Mizpah</h1>
    <div class="brand"><img src="../icons/icon32.png" alt="" width="20" height="20"> <span class="app-name"></span></div>
    <label class="switch" title="Pause or resume all blocking">
      <input type="checkbox" id="power" role="switch" aria-label="Blocking">
      <span></span>
    </label>
  </header>
  <main aria-label="Blocking on this page">
    <button class="warn" id="rebuild" hidden>Filter rules need a rebuild. Open Settings.</button>
    <section class="site">
      <div class="host" id="host">—</div>
      <div class="count"><span id="blocked">—</span><small>requests blocked on this page</small></div>
      <div class="popups" id="popups" hidden></div>
      <button id="toggleSite" class="primary">Trust this site</button>
      <div role="status"><p class="note" id="note" hidden>Reload the page to apply the change.</p></div>
    </section>
    <div class="warn-row" id="hostAccess" role="status" hidden>
      <p class="note">Mizpah can't hide ads or close pop-ups on this site until you allow it.</p>
      <button id="grantAccess" class="primary">Allow on this site</button>
    </div>
    <div class="actions">
      <button id="strictPopups" class="wide">Block all pop-ups on this site</button>
      <button id="picker">Hide an element</button>
      <button id="reload">Reload page</button>
      <button id="options">Settings</button>
    </div>
  </main>
  <footer id="status" role="status"></footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
